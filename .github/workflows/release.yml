name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rl-version:
        description: RL toolchain version (empty = rl-version.txt)
        required: false
        default: ""

permissions:
  contents: write

# One universal VSIX with all six platform builds (~400MB: 7 binaries
# times 6 targets). Uploads go to a draft release because published
# releases are immutable; publish the draft by hand after checking it.
jobs:
  package:
    name: Package VSIX (universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Extension Dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Fetch server binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-server.sh "${{ inputs.rl-version }}"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package
        run: vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-universal
          path: "*.vsix"

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          draft: true
          generate_release_notes: true
