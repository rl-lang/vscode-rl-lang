name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package VSIX (${{ matrix.target }} ${{ matrix.vscode-target }})
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            vscode-target: linux-x64
            os: ubuntu-latest
          - target: linux-aarch64
            vscode-target: linux-arm64
            os: ubuntu-latest
          - target: macos-x86_64
            vscode-target: darwin-x64
            os: ubuntu-latest
          - target: macos-aarch64
            vscode-target: darwin-arm64
            os: ubuntu-latest
          - target: windows-x86_64
            vscode-target: win32-x64
            os: ubuntu-latest
          - target: windows-aarch64
            vscode-target: win32-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Extension Dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Fetch server binaries
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/fetch-server.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"
          else
            ./scripts/fetch-server.sh "" "${{ matrix.target }}"
          fi

      - name: Drop other platforms
        run: |
          for d in server/*/; do
            [ "$d" = "server/${{ matrix.target }}/" ] || rm -rf "$d"
          done
          ls server/${{ matrix.target }}

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package
        run: vsce package --no-dependencies --target ${{ matrix.vscode-target }}

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
